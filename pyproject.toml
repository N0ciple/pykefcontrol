[project]
name = "pykefcontrol"
version = "1.0.0"
description = "Python library to control KEF W2-platform wireless speakers (LS50 Wireless II, LS60, LSX II, LSX II LT, XIO, LS LUXE) over the local network, sync or async."
authors = [{ name = "Robin Dupont", email = "robin.dpnt@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = [
    "KEF",
    "speaker",
    "W2",
    "LS50 Wireless II",
    "LS50W2",
    "LS60",
    "LSX II",
    "LSX II LT",
    "XIO",
    "LS LUXE",
    "home-assistant",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "urllib3>=2.0",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.132"]

[project.scripts]
pykefcontrol = "pykefcontrol.__main__:main"

[project.urls]
Homepage = "https://github.com/N0ciple/pykefcontrol"
Repository = "https://github.com/N0ciple/pykefcontrol"
Changelog = "https://github.com/N0ciple/pykefcontrol/blob/main/CHANGELOG.md"
Documentation = "https://github.com/N0ciple/pykefcontrol/blob/main/docs/documentation.md"
Issues = "https://github.com/N0ciple/pykefcontrol/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "trustme>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "zeroconf>=0.132",
    "pytest-timeout>=2.3",
]
notebook = ["jupyterlab>=4.1.0,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pykefcontrol", "tests", "scripts", "README.md", "CHANGELOG.md", "MIGRATION.md", "docs", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pykefcontrol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["kef-app"]

[tool.ruff.format]
exclude = ["pykefcontrol/_sync/client.py", "pykefcontrol/_sync/transport.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF012", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"pykefcontrol/_sync/client.py" = ["I001", "E501", "UP028"]
"pykefcontrol/_sync/transport.py" = ["I001", "E501"]
"tests/*" = ["S101", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pykefcontrol"]
exclude = ["kef-app/"]
